name: NUBEMO structural cleanup

on:
  push:
    branches:
      - 8ead6f85

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout -B nubemo-work origin/8ead6f85

      - name: Apply and validate cleanup
        run: |
          cd repo
          python scripts/nubemo_structural_cleanup.py
          node --check pro.js
          node --check professional-dashboard-bootstrap.js
          node --check professional-patient-summary-lazy.js
          node --check professional-guard.js
          grep -q "Paziente non ancora attivo" pro.js
          if grep -q "patchDraftStatusLabels" professional-dashboard-bootstrap.js; then exit 1; fi
          if grep -q "new MutationObserver" professional-patient-summary-lazy.js; then exit 1; fi
          if grep -q "professional-patient-actions-menu.js" professional-guard.js; then exit 1; fi

      - name: Commit cleanup
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Structural cleanup dashboard patient flow"
          git push origin HEAD:8ead6f85
