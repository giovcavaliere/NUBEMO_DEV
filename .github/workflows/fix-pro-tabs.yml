name: Fix pro tabs
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/8ead6f85
          fetch-depth: 0
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('professional-guard.js')
          s=p.read_text(encoding='utf-8')
          old="""    const tabButton=target?.closest?.('[data-tab]');
    if(tabButton&&tabButton.dataset.tab!=='summary')return true;
    return !!target?.closest?.('#goAgenda,[data-event],[data-patient],#newPatient,#editPatientProfileLegacy,#patientMenuEditProfile,#deletePatient');"""
          new="""    const patientTab=target?.closest?.('[data-patient-tab]');
    if(patientTab&&patientTab.dataset.patientTab!=='summary')return true;
    const drawerTab=target?.closest?.('[data-drawer-tab]');
    if(drawerTab&&drawerTab.dataset.drawerTab!=='summary')return true;
    return !!target?.closest?.('#goAgenda,[data-event],[data-patient],#newPatient,#editPatientProfileLegacy,#patientMenuEditProfile,#deletePatient');"""
          if s.count(old)!=1: raise SystemExit(f'needsFullRuntime match count {s.count(old)}')
          s=s.replace(old,new,1)
          old="""      const anyAction=target.closest?.('[data-view],[data-drawer-view],[data-bmi-category],[data-tab],#openUnreadLabPatients,#openUnreadPatients,#goAgenda,[data-event],[data-patient],#newPatient,#editPatientProfileLegacy,#patientMenuEditProfile,#deletePatient');"""
          new="""      const anyAction=target.closest?.('[data-view],[data-drawer-view],[data-bmi-category],[data-patient-tab],[data-drawer-tab],#openUnreadLabPatients,#openUnreadPatients,#goAgenda,[data-event],[data-patient],#newPatient,#editPatientProfileLegacy,#patientMenuEditProfile,#deletePatient');"""
          if s.count(old)!=1: raise SystemExit(f'anyAction match count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('pro.html'); s=p.read_text(encoding='utf-8').replace('professional-guard.js?v=nubemo40structure01','professional-guard.js?v=nubemo40structure02'); p.write_text(s,encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8'); s=s.replace("const CACHE='nubemo-demo-v4.0-structure01';","const CACHE='nubemo-demo-v4.0-structure02';"); s=s.replace('./professional-guard.js?v=nubemo40structure01','./professional-guard.js?v=nubemo40structure02'); p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-pro-tabs.yml').unlink()
          PY
          node --check professional-guard.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix professional patient tab runtime gate"
          git push origin HEAD:8ead6f85
