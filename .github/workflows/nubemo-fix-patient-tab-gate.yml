name: NUBEMO patient tab gate fix

on:
  push:
    branches: ['8ead6f85']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout -B 8ead6f85 origin/8ead6f85

      - name: Fix lazy gate structurally
        shell: bash
        run: |
          cd repo
          python - <<'PY'
          from pathlib import Path
          p=Path('professional-guard.js')
          s=p.read_text(encoding='utf-8')

          old="""    const tabButton=target?.closest?.('[data-tab]');
    if(tabButton&&tabButton.dataset.tab!=='summary')return true;
    return !!target?.closest?.('#goAgenda,[data-event],[data-patient],#newPatient,#editPatientProfileLegacy,#patientMenuEditProfile,#deletePatient');"""
          new="""    const patientTab=target?.closest?.('[data-patient-tab]');
    if(patientTab&&patientTab.dataset.patientTab!=='summary')return true;
    const drawerTab=target?.closest?.('[data-drawer-tab]');
    if(drawerTab&&drawerTab.dataset.drawerTab!=='summary')return true;
    return !!target?.closest?.('#goAgenda,[data-event],[data-patient],#newPatient,#editPatientProfileLegacy,#patientMenuEditProfile,#deletePatient');"""
          if s.count(old)!=1:
              raise SystemExit(f'needsFullRuntime block match count {s.count(old)}')
          s=s.replace(old,new,1)

          old="""      const anyAction=target.closest?.('[data-view],[data-drawer-view],[data-bmi-category],[data-tab],#openUnreadLabPatients,#openUnreadPatients,#goAgenda,[data-event],[data-patient],#newPatient,#editPatientProfileLegacy,#patientMenuEditProfile,#deletePatient');"""
          new="""      const anyAction=target.closest?.('[data-view],[data-drawer-view],[data-bmi-category],[data-patient-tab],[data-drawer-tab],#openUnreadLabPatients,#openUnreadPatients,#goAgenda,[data-event],[data-patient],#newPatient,#editPatientProfileLegacy,#patientMenuEditProfile,#deletePatient');"""
          if s.count(old)!=1:
              raise SystemExit(f'anyAction selector match count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('pro.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('professional-guard.js?v=nubemo40structure01','professional-guard.js?v=nubemo40structure02')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r"const CACHE='[^']+';","const CACHE='nubemo-demo-v4.0-structure02';",s,count=1)
          s=s.replace('./professional-guard.js?v=nubemo40structure01','./professional-guard.js?v=nubemo40structure02')
          p.write_text(s,encoding='utf-8')

          Path('.github/workflows/nubemo-fix-patient-tab-gate.yml').unlink()
          PY
          node --check professional-guard.js
          grep -q "data-patient-tab" professional-guard.js
          grep -q "data-drawer-tab" professional-guard.js

      - name: Commit fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix patient tab lazy runtime gate"
          git push origin HEAD:8ead6f85
